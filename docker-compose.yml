name: ovozai

# Local development infrastructure for OvozAI — Phase 1.
# Brings up PostgreSQL and Redis. Object storage (MinIO) and LiveKit
# are added in later phases (see commented blocks at the bottom).
#
#   pnpm docker:up      # start in the background
#   pnpm docker:down    # stop and remove containers
#   pnpm docker:logs    # tail logs

services:
  postgres:
    image: postgres:16-alpine
    container_name: ovozai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovozai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovozai}
      POSTGRES_DB: ${POSTGRES_DB:-ovozai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ovozai} -d ${POSTGRES_DB:-ovozai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ovozai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
